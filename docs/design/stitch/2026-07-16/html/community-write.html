<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e5effc",
                        "on-tertiary-fixed": "#191c1e",
                        "tertiary-container": "#727577",
                        "inverse-surface": "#28313b",
                        "background": "#f7f9ff",
                        "outline-variant": "#bdcabd",
                        "on-primary-fixed": "#00210d",
                        "on-tertiary-fixed-variant": "#444749",
                        "inverse-on-surface": "#e8f2ff",
                        "on-surface": "#131c26",
                        "on-secondary-fixed": "#1c1b1b",
                        "tertiary": "#595c5e",
                        "surface-tint": "#006d39",
                        "inverse-primary": "#72dc93",
                        "secondary-container": "#e5e2e1",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#f6fff4",
                        "outline": "#6e7a6f",
                        "surface-variant": "#d9e3f1",
                        "surface": "#f7f9ff",
                        "surface-container-high": "#dfe9f6",
                        "on-tertiary-container": "#fbfdff",
                        "primary-fixed-dim": "#72dc93",
                        "error-container": "#ffdad6",
                        "secondary": "#5f5e5e",
                        "surface-container-highest": "#d9e3f1",
                        "surface-container-low": "#edf4ff",
                        "on-background": "#131c26",
                        "on-primary-fixed-variant": "#005229",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "secondary-fixed": "#e5e2e1",
                        "primary-fixed": "#8ef9ad",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3e4a40",
                        "on-secondary-fixed-variant": "#474646",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#656464",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-bright": "#f7f9ff",
                        "surface-dim": "#d1dbe8",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-container": "#078648",
                        "primary": "#006a37"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-xl": "48px",
                        "stack-md": "16px",
                        "gutter-grid": "12px",
                        "stack-sm": "8px",
                        "margin-page": "24px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Noto Sans KR"],
                        "headline-md": ["Noto Sans KR"],
                        "body-lg": ["Noto Sans KR"],
                        "label-sm": ["Noto Sans KR"],
                        "headline-lg": ["Noto Sans KR"],
                        "label-lg": ["Noto Sans KR"],
                        "display-lg": ["Noto Sans KR"]
                    },
                    "fontSize": {
                        "body-md": ["15px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                        "body-lg": ["17px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-lg": ["14px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff;
            color: #131c26;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus, textarea:focus {
            outline: none;
        }
        textarea {
            resize: none;
        }
        .ios-toggle:checked + .ios-toggle-label {
            background-color: #006a37;
        }
        .ios-toggle:checked + .ios-toggle-label::after {
            transform: translateX(100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest border-b border-secondary-container flex justify-between items-center px-margin-page h-[56px]">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">글쓰기</h1>
<button class="text-primary font-bold opacity-40 cursor-not-allowed transition-opacity" id="submitBtn">
            등록
        </button>
</header>
<!-- Main Content Area -->
<main class="pt-[56px] pb-[80px]">
<!-- Toolbar Section -->
<section class="flex items-center justify-between px-margin-page py-stack-md bg-surface-container-lowest border-b border-surface-variant">
<div class="flex items-center space-x-5">
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-90 transition-transform">photo_camera</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-90 transition-transform">image</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-90 transition-transform">description</span>
</button>
</div>
<div class="flex items-center space-x-4">
<label class="flex items-center space-x-2 cursor-pointer">
<span class="font-label-lg text-label-lg text-on-surface-variant">질문</span>
<div class="relative">
<input class="ios-toggle sr-only" type="checkbox">
<div class="ios-toggle-label w-10 h-6 bg-secondary-container rounded-full transition-colors duration-200 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[20px] after:w-[20px] after:transition-transform after:duration-200"></div>
</div>
</label>
<label class="flex items-center space-x-2 cursor-pointer">
<span class="font-label-lg text-label-lg text-on-surface-variant">익명</span>
<div class="relative">
<input class="ios-toggle sr-only" type="checkbox">
<div class="ios-toggle-label w-10 h-6 bg-secondary-container rounded-full transition-colors duration-200 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[20px] after:w-[20px] after:transition-transform after:duration-200"></div>
</div>
</label>
</div>
</section>
<!-- Editor Section -->
<div class="px-margin-page py-stack-md flex flex-col space-y-stack-md">
<!-- Board Selection Pill -->
<div>
<button class="inline-flex items-center space-x-1 px-4 py-2 bg-surface-container rounded-full text-primary border border-primary-fixed-dim hover:bg-surface-variant transition-colors group">
<span class="font-label-lg text-label-lg">게시판 선택</span>
<span class="material-symbols-outlined text-[18px] group-active:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
<!-- Title Input -->
<div class="border-b border-surface-variant py-2">
<input class="w-full font-headline-md text-headline-md bg-transparent placeholder-outline focus:placeholder-transparent border-none p-0" id="titleInput" placeholder="제목을 입력해 주세요" type="text">
</div>
<!-- Body Editor -->
<div class="min-h-[400px]">
<textarea class="w-full h-full font-body-lg text-body-lg bg-transparent placeholder-outline focus:placeholder-transparent border-none p-0 leading-relaxed" id="bodyTextarea" placeholder="자유로운 주제로 소통해 보세요."></textarea>
</div>
</div>
</main>
<!-- Attachment Preview Layer (Hidden by default) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest px-margin-page py-stack-sm border-t border-surface-variant hidden" id="attachmentTray">
<div class="flex overflow-x-auto space-x-2 pb-2">
<!-- Dynamic attachment items would go here -->
</div>
</div>
<script>
        const titleInput = document.getElementById('titleInput');
        const bodyTextarea = document.getElementById('bodyTextarea');
        const submitBtn = document.getElementById('submitBtn');

        function updateSubmitState() {
            const hasTitle = titleInput.value.trim().length > 0;
            const hasBody = bodyTextarea.value.trim().length > 0;

            if (hasTitle && hasBody) {
                submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
                submitBtn.classList.add('opacity-100', 'cursor-pointer');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
                submitBtn.classList.remove('opacity-100', 'cursor-pointer');
                submitBtn.disabled = true;
            }
        }

        titleInput.addEventListener('input', updateSubmitState);
        bodyTextarea.addEventListener('input', updateSubmitState);

        // Auto-expand textarea (optional, but good for UX)
        bodyTextarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Simple button active effects
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
