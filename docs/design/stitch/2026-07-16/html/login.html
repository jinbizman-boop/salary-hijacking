<!DOCTYPE html><html lang="ko" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            border-color: #006a37 !important;
        }
        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid #E5E8EB;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            position: relative;
        }
        .custom-checkbox:checked {
            background-color: #006a37;
            border-color: #006a37;
        }
        .custom-checkbox:checked::after {
            content: 'check';
            font-family: 'Material Symbols Outlined';
            font-size: 16px;
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006a37",
                        "on-surface-variant": "#3e4a40",
                        "surface": "#f7f9ff",
                        "outline-variant": "#bdcabd",
                        "on-surface": "#131c26",
                        "brand-kakao": "#FEE500",
                        "brand-naver": "#03C75A",
                        "input-bg": "#F7F8FA",
                        "input-border": "#E5E8EB"
                    },
                    "borderRadius": {
                        "xl": "12px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-xl": "48px",
                        "stack-md": "16px",
                        "margin-page": "24px",
                        "stack-sm": "8px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Noto Sans KR"],
                        "label-lg": ["Noto Sans KR"],
                        "headline-md": ["Noto Sans KR"],
                        "label-sm": ["Noto Sans KR"],
                        "display-lg": ["Noto Sans KR"],
                        "headline-lg": ["Noto Sans KR"],
                        "body-lg": ["Noto Sans KR"]
                    },
                    "fontSize": {
                        "body-md": ["15px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "display-lg": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["24px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg": ["17px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-on-surface min-h-screen flex flex-col items-center">
<!-- Top App Bar (Suppressing Shell as per Transactional Rule) -->
<header class="w-full h-14 flex items-center px-margin-page sticky top-0 bg-white z-50">
<button class="material-symbols-outlined text-on-surface" onclick="history.back()">arrow_back</button>
</header>
<main class="w-full max-w-[390px] px-margin-page flex flex-col flex-grow">
<!-- Brand Lockup -->
<section class="flex flex-col gap-stack-md">
<div class="flex flex-col">
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">Salary Hijacking</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">금융의 주도권을 되찾으세요</p>
</div>
<div class="mt-stack-lg">
<h2 class="font-display-lg text-display-lg">로그인</h2>
</div>
</section>
<!-- Credential Form -->
<section class="space-y-4">
<!-- ID Input -->
<div class="flex flex-col gap-2"><label class="font-label-lg text-label-lg text-on-surface-variant" for="username">아이디</label>
<input class="w-full h-14 px-4 bg-white border-2 border-outline-variant rounded-xl focus:border-primary focus:outline-none transition-all font-body-lg text-body-lg" id="username" placeholder="아이디를 입력하세요" type="text"></div>
<!-- Password Input -->
<div class="flex flex-col gap-2"><label class="font-label-lg text-label-lg text-on-surface-variant" for="password">비밀번호</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-white border-2 border-outline-variant rounded-xl focus:outline-none transition-all font-body-lg text-body-lg" id="password-input" placeholder="비밀번호를 입력하세요" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility_off</span>
</button>
</div></div>
<!-- Utility Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="custom-checkbox" type="checkbox">
<span class="text-label-lg font-medium text-slate-600">자동 로그인</span>
</label>
<a class="text-label-lg font-medium text-slate-400 hover:text-slate-600" href="#">비밀번호 찾기</a>
</div>
<!-- Login Button -->
<button class="w-full h-[56px] bg-primary text-on-primary font-bold text-[17px] rounded-xl mt-4 active:scale-95 transition-transform shadow-lg shadow-primary/20">로그인</button>
</section>
<!-- Social Login Area -->
<section class="mt-stack-xl mb-10"><div class="flex items-center gap-4 py-4">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">또는</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<div class="flex flex-col gap-stack-sm">
<button class="w-full h-14 bg-[#FEE500] text-[#191919] font-bold text-[17px] rounded-xl flex items-center justify-center gap-3 active:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
                    카카오로 계속하기
                </button>
<button class="w-full h-14 bg-[#03C75A] text-white font-bold text-[17px] rounded-xl flex items-center justify-center gap-3 active:opacity-90 transition-opacity">
<span class="material-symbols-outlined font-bold">1k</span>
                    네이버로 계속하기
                </button>
<button class="w-full h-14 bg-on-background text-on-primary font-bold text-[17px] rounded-xl flex items-center justify-center gap-3 active:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">apps</span>
                    Apple로 로그인
                </button>
</div></section>
<!-- Footer Links -->
<section class="mt-auto pb-10 flex flex-col items-center gap-6"><div class="flex justify-center py-stack-md">
<span class="font-body-md text-body-md text-on-surface-variant">계정이 없으신가요?</span>
<button class="font-label-lg text-label-lg text-primary ml-2 underline underline-offset-4">회원가입</button>
</div></section>
</main>
<!-- Bottom Spacing for Home Indicator -->
<div class="h-[34px] w-full"></div>
<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple logic to enable/disable button based on input length
        const idInput = document.querySelector('input[type="text"]');
        const pwInput = document.querySelector('input[type="password"]');
        const loginBtn = document.querySelector('button[disabled]');

        function validateInputs() {
            if (idInput.value.length > 0 && pwInput.value.length > 0) {
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-40');
            } else {
                loginBtn.disabled = true;
                loginBtn.classList.add('opacity-40');
            }
        }

        idInput.addEventListener('input', validateInputs);
        pwInput.addEventListener('input', validateInputs);
    </script>


</body></html>
