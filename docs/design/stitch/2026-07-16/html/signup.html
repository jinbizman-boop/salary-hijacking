<style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff;
            color: #131c26;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input:focus {
            border-color: #006a37 !important;
            box-shadow: 0 0 0 1px #006a37 !important;
        }
        .sticky-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px 32px 24px;
            background: linear-gradient(to top, #ffffff 80%, rgba(255,255,255,0));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest min-h-screen flex flex-col">
<!-- Top Bar: Custom Navigation for Focused View -->
<header class="flex items-center justify-between px-4 h-14 bg-white sticky top-0 z-10">
<button class="flex items-center justify-center w-10 h-10 -ml-2 text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1"></div>
</header>
<main class="flex-1 flex flex-col px-margin-page pb-32">
<!-- Progress Bar Section -->
<div class="mt-2 mb-8">
<div class="flex justify-end mb-2">
<span class="text-label-sm text-secondary font-medium">1 / 4</span>
</div>
<div class="h-1.5 w-full bg-secondary-fixed rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Headline Section -->
<section class="mb-stack-lg">
<h1 class="text-headline-lg text-on-surface mb-2">사용할 계정정보를 입력해 주세요</h1>
<p class="text-body-md text-on-surface-variant">로그인과 계정 복구에 사용할 정보예요.</p>
</section>
<!-- Form Section -->
<form class="space-y-stack-lg">
<!-- ID Field -->
<div class="flex flex-col gap-2">
<label class="text-label-lg text-on-surface">아이디</label>
<div class="flex gap-2">
<input class="form-input flex-1 h-14 px-4 bg-surface rounded-xl border-outline-variant text-body-md placeholder:text-outline focus:outline-none transition-all" placeholder="아이디를 입력해 주세요" type="text">
<button class="h-14 px-5 bg-secondary-fixed text-on-secondary-fixed text-label-lg rounded-xl whitespace-nowrap active:scale-95 transition-transform" type="button">
                        중복 확인
                    </button>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-label-lg text-on-surface">이메일</label>
<input class="form-input w-full h-14 px-4 bg-surface rounded-xl border-outline-variant text-body-md placeholder:text-outline focus:outline-none transition-all" inputmode="email" placeholder="example@email.com" type="email">
</div>
<!-- Nickname Field -->
<div class="flex flex-col gap-2">
<label class="text-label-lg text-on-surface">닉네임</label>
<input class="form-input w-full h-14 px-4 bg-surface rounded-xl border-outline-variant text-body-md placeholder:text-outline focus:outline-none transition-all" placeholder="앱에서 사용할 닉네임을 입력해 주세요" type="text">
<p class="text-[12px] text-outline px-1">욕설이나 비속어가 포함된 닉네임은 제재될 수 있습니다.</p>
</div>
</form>
<!-- Decorative Element (Light Atmosphere) -->
<div class="mt-12 opacity-40">
<webgl-shader class="w-full h-32 rounded-3xl overflow-hidden" src="{{DATA:ANIMATION:ANIMATION_1}}"></webgl-shader>
</div>
</main>
<!-- Sticky Bottom Button -->
<div class="sticky-bottom max-w-md mx-auto w-full">
<button class="w-full h-14 bg-primary text-on-primary text-headline-md rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
            다음
        </button>
</div>
<script>
        // Simple micro-interaction for the "Next" button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                this.innerHTML = '다음';
                // In a real app, this would navigate to progress 2/4
            }, 800);
        });

        // Input focus animations
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
