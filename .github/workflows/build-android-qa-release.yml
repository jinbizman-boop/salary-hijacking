name: Build Android QA Release

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android ABI to build first.
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - arm64-v8a
      upload_apk:
        description: Upload the no-secret QA APK artifact.
        required: true
        default: true
        type: boolean
      source_ref:
        description: Git ref or SHA to check out as the frozen application source.
        required: false
        default: ""
        type: string
      application_rc_source_sha:
        description: Expected 40-character application RC source commit SHA.
        required: false
        default: ""
        type: string
  push:
    branches:
      - codex/payroll-reminder-launch-ready-100-20260714
    paths:
      - ".github/workflows/build-android-qa-release.yml"
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

concurrency:
  group: android-qa-release-${{ github.ref }}-${{ github.event.inputs.source_ref || github.event.inputs.application_rc_source_sha || github.sha }}-${{ github.event.inputs.architecture || 'x86_64' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  NODE_ENV: test
  FORCE_COLOR: "1"
  TZ: Asia/Seoul
  MOBILE_APP_DIR: apps/mobile
  APPLICATION_BUILD_REF: ${{ github.event.inputs.source_ref || github.sha }}
  RC_SOURCE_SHA: ${{ github.event.inputs.application_rc_source_sha || github.sha }}
  QA_ANDROID_ARCHITECTURE: ${{ github.event.inputs.architecture || 'x86_64' }}
  QA_APK_OUTPUT: build/qa/android/salary-hijacking-qaRelease-${{ github.event.inputs.architecture || 'x86_64' }}.apk
  APP_ENV: staging
  EXPO_PUBLIC_API_BASE_URL: https://api-staging.salaryhijacking.com
  EXPO_PUBLIC_DEEPLINK_HOST: staging.salaryhijacking.com
  EXPO_PUBLIC_RELEASE_CHANNEL: staging
  EXPO_PUBLIC_CRASH_REPORTING_ENABLED: "true"
  EXPO_PUBLIC_E2E_BUILD: "false"
  GOOGLE_SERVICES_JSON: ./secrets/firebase/google-services.json

jobs:
  build-qa-release:
    name: Build ${{ github.event.inputs.architecture || 'x86_64' }} qaRelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: staging

    steps:
      - name: Checkout frozen RC source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.APPLICATION_BUILD_REF }}

      - name: Verify RC source lineage
        run: |
          set -euo pipefail
          checked_out_head="$(git rev-parse HEAD)"
          if ! [[ "$RC_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf '::error::application_rc_source_sha must be a 40-character commit SHA; got %s\n' "$RC_SOURCE_SHA"
            exit 1
          fi
          test "$checked_out_head" = "$RC_SOURCE_SHA"
          printf 'WORKFLOW_CONTROL_REF=%s\n' "$GITHUB_REF_NAME"
          printf 'APPLICATION_BUILD_REF=%s\n' "$APPLICATION_BUILD_REF"
          printf 'APPLICATION_RC_SOURCE_SHA=%s\n' "$RC_SOURCE_SHA"
          printf 'CONTROL_PLANE_WORKFLOW_SHA=%s\n' "$GITHUB_SHA"

      - name: Compute current mobile source fingerprint
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.cwd();
          const mobileRoot = path.join(root, "apps", "mobile");
          const include = new Set([".ts", ".tsx", ".js", ".json", ".cjs", ".mjs"]);
          const skip = new Set(["node_modules", ".expo", "coverage", "dist", "build"]);
          const sha256 = (value) => createHash("sha256").update(value).digest("hex").toUpperCase();
          const walk = (dir) => fs.readdirSync(dir).flatMap((name) => {
            const absolute = path.join(dir, name);
            const stat = fs.statSync(absolute);
            if (stat.isDirectory()) return skip.has(name) ? [] : walk(absolute);
            return include.has(path.extname(name)) ? [absolute] : [];
          });
          const files = walk(mobileRoot)
            .map((file) => path.relative(root, file).split(path.sep).join("/"))
            .sort();
          const digestInput = files.map((file) => `${file}:${sha256(fs.readFileSync(path.join(root, file)))}`).join("\n");
          console.log(`RC_SOURCE_FINGERPRINT=${sha256(digestInput)}`);
          console.log(`RC_SOURCE_FILE_COUNT=${files.length}`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_cmd="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_cmd" ]; then
            printf '::error::sdkmanager is unavailable at %s\n' "$sdkmanager_cmd"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "$android_sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$android_sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$android_sdk_root/build-tools/35.0.0" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$sdkmanager_cmd" --licenses >/dev/null
          sdk_license_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$sdk_license_status" -ne 0 ]; then
            printf '::error::Android SDK license acceptance failed with exit code %s\n' "$sdk_license_status"
            exit "$sdk_license_status"
          fi

          "$sdkmanager_cmd" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate staging QA secrets are present
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.SALARY_HIJACKING_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEY_PASSWORD }}
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            QA_KEYSTORE_BASE64 \
            QA_KEYSTORE_PASSWORD \
            QA_KEY_ALIAS \
            QA_KEY_PASSWORD \
            FIREBASE_ANDROID_JSON_BASE64
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing staging Environment secret(s): %s\n' "${missing[*]}"
            exit 2
          fi
          printf 'Staging QA secret presence verified without exposing values.\n'

      - name: Materialize QA signing and Firebase config
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.SALARY_HIJACKING_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEY_PASSWORD }}
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$QA_KEYSTORE_BASE64"
          echo "::add-mask::$QA_KEYSTORE_PASSWORD"
          echo "::add-mask::$QA_KEY_ALIAS"
          echo "::add-mask::$QA_KEY_PASSWORD"
          echo "::add-mask::$FIREBASE_ANDROID_JSON_BASE64"

          qa_dir="$RUNNER_TEMP/salary-hijacking-qa-signing"
          mkdir -p "$qa_dir" "$MOBILE_APP_DIR/secrets/firebase"
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$qa_dir/qa-release.jks"
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > "$MOBILE_APP_DIR/secrets/firebase/google-services.json"
          chmod 600 "$qa_dir/qa-release.jks" "$MOBILE_APP_DIR/secrets/firebase/google-services.json"

          {
            echo "SALARY_HIJACKING_QA_KEYSTORE_FILE=$qa_dir/qa-release.jks"
            echo "SALARY_HIJACKING_QA_KEYSTORE_PASSWORD=$QA_KEYSTORE_PASSWORD"
            echo "SALARY_HIJACKING_QA_KEY_ALIAS=$QA_KEY_ALIAS"
            echo "SALARY_HIJACKING_QA_KEY_PASSWORD=$QA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: qaRelease build preflight
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node scripts/validate-android-qa-bundle-preflight.mjs
          rm -rf build/qa/android/metro-preflight
          pnpm exec expo export \
            --platform android \
            --output-dir build/qa/android/metro-preflight
          node scripts/expo-local-android-debug-build.mjs \
            --check \
            --build-type qaRelease \
            --architecture "$QA_ANDROID_ARCHITECTURE" \
            --output "$QA_APK_OUTPUT"

      - name: Build full Expo Router qaRelease APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node scripts/expo-local-android-debug-build.mjs \
            --build-type qaRelease \
            --architecture "$QA_ANDROID_ARCHITECTURE" \
            --output "$QA_APK_OUTPUT"

      - name: Verify qaRelease APK contract
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          apk="$QA_APK_OUTPUT"
          test -s "$apk"

          mkdir -p build/qa/android/evidence
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          bundle_sha="$(unzip -p "$apk" assets/index.android.bundle | sha256sum | awk '{print $1}')"
          signer="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"

          unzip -l "$apk" | grep -q "lib/$QA_ANDROID_ARCHITECTURE/"
          canonical_api_host="https://api-staging.salaryhijacking.com"
          rejected_api_host="https://api-staging.salary""-hijacking.com"
          unzip -p "$apk" assets/index.android.bundle | grep -Fq "$canonical_api_host"
          ! unzip -p "$apk" assets/index.android.bundle | grep -Fq "$rejected_api_host"
          ! unzip -p "$apk" assets/index.android.bundle | grep -Fq "localhost"
          ! unzip -p "$apk" assets/index.android.bundle | grep -aFq "127.0.0.1"
          ! unzip -p "$apk" assets/index.android.bundle | grep -aFq "10.0.2.2"
          ! unzip -p "$apk" assets/index.android.bundle | grep -Eiq "safe[-]entry|direct[-]entry|capture[-]only"

          cat > build/qa/android/evidence/build-info.json <<JSON
          {
            "schemaVersion": 1,
            "secretsRedacted": true,
            "containsSecretValues": false,
            "rcSourceSha": "$RC_SOURCE_SHA",
            "sourceCommit": "$RC_SOURCE_SHA",
            "sourceFingerprint": "$RC_SOURCE_FINGERPRINT",
            "sourceFileCount": ${RC_SOURCE_FILE_COUNT:-0},
            "checkedOutSha": "$(git rev-parse HEAD)",
            "workflowSha": "$GITHUB_SHA",
            "branch": "$GITHUB_REF_NAME",
            "buildType": "qaRelease",
            "architecture": "$QA_ANDROID_ARCHITECTURE",
            "applicationId": "com.salaryhijacking.mobile",
            "versionName": "1.0.0",
            "versionCode": 1,
            "apkSha256": "$apk_sha",
            "bundleSha256": "$bundle_sha",
            "signerCertificateSha256": "$signer",
            "embeddedEnvironment": "staging",
            "apiBaseUrl": "https://api-staging.salaryhijacking.com",
            "e2eBuild": false,
            "buildTimestampUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Upload QA APK and no-secret metadata
        if: ${{ github.event.inputs.upload_apk != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-release-${{ github.event.inputs.architecture || 'x86_64' }}-${{ env.RC_SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/mobile/${{ env.QA_APK_OUTPUT }}
            apps/mobile/build/qa/android/evidence/build-info.json
