name: Build Android QA Release

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android ABI to build first.
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - arm64-v8a
      upload_apk:
        description: Upload the no-secret QA APK artifact.
        required: true
        default: true
        type: boolean
  push:
    branches:
      - codex/payroll-reminder-launch-ready-100-20260714
    paths:
      - ".github/workflows/build-android-qa-release.yml"
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

concurrency:
  group: android-qa-release-${{ github.ref }}-${{ github.event.inputs.architecture || 'x86_64' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  NODE_ENV: test
  FORCE_COLOR: "1"
  TZ: Asia/Seoul
  MOBILE_APP_DIR: apps/mobile
  RC_SOURCE_SHA: 80cc5cdfb0758478791b19196e2812e7fa6d671f
  QA_ANDROID_ARCHITECTURE: ${{ github.event.inputs.architecture || 'x86_64' }}
  QA_APK_OUTPUT: build/qa/android/salary-hijacking-qaRelease-${{ github.event.inputs.architecture || 'x86_64' }}.apk
  APP_ENV: staging
  EXPO_PUBLIC_API_BASE_URL: https://api-staging.salaryhijacking.com
  EXPO_PUBLIC_DEEPLINK_HOST: staging.salaryhijacking.com
  EXPO_PUBLIC_RELEASE_CHANNEL: staging
  EXPO_PUBLIC_CRASH_REPORTING_ENABLED: "true"
  EXPO_PUBLIC_E2E_BUILD: "false"
  GOOGLE_SERVICES_JSON: ./secrets/firebase/google-services.json

jobs:
  build-qa-release:
    name: Build ${{ github.event.inputs.architecture || 'x86_64' }} qaRelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: staging

    steps:
      - name: Checkout frozen RC source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 80cc5cdfb0758478791b19196e2812e7fa6d671f

      - name: Verify RC source lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SOURCE_SHA"
          test "$GITHUB_REF_NAME" = "codex/payroll-reminder-launch-ready-100-20260714"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate staging QA secrets are present
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.SALARY_HIJACKING_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEY_PASSWORD }}
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            QA_KEYSTORE_BASE64 \
            QA_KEYSTORE_PASSWORD \
            QA_KEY_ALIAS \
            QA_KEY_PASSWORD \
            FIREBASE_ANDROID_JSON_BASE64
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing staging Environment secret(s): %s\n' "${missing[*]}"
            exit 2
          fi
          printf 'Staging QA secret presence verified without exposing values.\n'

      - name: Materialize QA signing and Firebase config
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.SALARY_HIJACKING_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.SALARY_HIJACKING_QA_KEY_PASSWORD }}
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$QA_KEYSTORE_BASE64"
          echo "::add-mask::$QA_KEYSTORE_PASSWORD"
          echo "::add-mask::$QA_KEY_ALIAS"
          echo "::add-mask::$QA_KEY_PASSWORD"
          echo "::add-mask::$FIREBASE_ANDROID_JSON_BASE64"

          qa_dir="$RUNNER_TEMP/salary-hijacking-qa-signing"
          mkdir -p "$qa_dir" "$MOBILE_APP_DIR/secrets/firebase"
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$qa_dir/qa-release.jks"
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > "$MOBILE_APP_DIR/secrets/firebase/google-services.json"
          chmod 600 "$qa_dir/qa-release.jks" "$MOBILE_APP_DIR/secrets/firebase/google-services.json"

          {
            echo "SALARY_HIJACKING_QA_KEYSTORE_FILE=$qa_dir/qa-release.jks"
            echo "SALARY_HIJACKING_QA_KEYSTORE_PASSWORD=$QA_KEYSTORE_PASSWORD"
            echo "SALARY_HIJACKING_QA_KEY_ALIAS=$QA_KEY_ALIAS"
            echo "SALARY_HIJACKING_QA_KEY_PASSWORD=$QA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: qaRelease build preflight
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node scripts/expo-local-android-debug-build.mjs \
            --check \
            --build-type qaRelease \
            --architecture "$QA_ANDROID_ARCHITECTURE" \
            --output "$QA_APK_OUTPUT"

      - name: Build full Expo Router qaRelease APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node scripts/expo-local-android-debug-build.mjs \
            --build-type qaRelease \
            --architecture "$QA_ANDROID_ARCHITECTURE" \
            --output "$QA_APK_OUTPUT"

      - name: Verify qaRelease APK contract
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          apk="$QA_APK_OUTPUT"
          test -s "$apk"

          mkdir -p build/qa/android/evidence
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          bundle_sha="$(unzip -p "$apk" assets/index.android.bundle | sha256sum | awk '{print $1}')"
          signer="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"

          unzip -l "$apk" | grep -q "lib/$QA_ANDROID_ARCHITECTURE/"
          canonical_api_host="https://api-staging.salaryhijacking.com"
          rejected_api_host="https://api-staging.salary""-hijacking.com"
          unzip -p "$apk" assets/index.android.bundle | grep -Fq "$canonical_api_host"
          ! unzip -p "$apk" assets/index.android.bundle | grep -Fq "$rejected_api_host"
          ! unzip -p "$apk" assets/index.android.bundle | grep -Fq "localhost"
          ! unzip -p "$apk" assets/index.android.bundle | grep -Eiq "safe[-]entry|direct[-]entry|capture[-]only"

          cat > build/qa/android/evidence/build-info.json <<JSON
          {
            "schemaVersion": 1,
            "secretsRedacted": true,
            "containsSecretValues": false,
            "rcSourceSha": "$RC_SOURCE_SHA",
            "checkedOutSha": "$(git rev-parse HEAD)",
            "workflowSha": "$GITHUB_SHA",
            "branch": "$GITHUB_REF_NAME",
            "buildType": "qaRelease",
            "architecture": "$QA_ANDROID_ARCHITECTURE",
            "applicationId": "com.salaryhijacking.mobile",
            "versionName": "1.0.0",
            "versionCode": 1,
            "apkSha256": "$apk_sha",
            "bundleSha256": "$bundle_sha",
            "signerCertificateSha256": "$signer",
            "embeddedEnvironment": "staging",
            "apiBaseUrl": "https://api-staging.salaryhijacking.com",
            "e2eBuild": false,
            "buildTimestampUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Upload QA APK and no-secret metadata
        if: ${{ github.event.inputs.upload_apk != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-release-${{ github.event.inputs.architecture || 'x86_64' }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/mobile/${{ env.QA_APK_OUTPUT }}
            apps/mobile/build/qa/android/evidence/build-info.json
