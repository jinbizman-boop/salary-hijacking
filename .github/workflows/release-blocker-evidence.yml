name: release-blocker-evidence

on:
  workflow_dispatch:
    inputs:
      run_production_aab:
        description: "Build and download the final Android production AAB proof."
        required: true
        default: true
        type: boolean
      run_d016_alerts:
        description: "Collect no-secret D016 alert policy and routing proof."
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  FORCE_COLOR: "0"
  NO_COLOR: "1"
  TERM: dumb
  TZ: Asia/Seoul
  MOBILE_APP_DIR: apps/mobile

jobs:
  d016-alerts-proof:
    name: D016 alerts no-secret proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.run_d016_alerts != 'false'

    environment:
      name: production

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect alert policy and synthetic routing evidence
        id: collect
        run: |
          set -euo pipefail

          mkdir -p release

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const outPath = "release/d016-alerts-proof.local.json";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || "";
          const token = process.env.CLOUDFLARE_API_TOKEN || "";
          const slackWebhookUrl = process.env.SLACK_WEBHOOK_URL || "";
          const missing = [];

          if (!accountId) missing.push("CLOUDFLARE_ACCOUNT_ID");
          if (!token) missing.push("CLOUDFLARE_API_TOKEN");
          if (!slackWebhookUrl) missing.push("SLACK_WEBHOOK_URL");

          const hash = (value) =>
            crypto.createHash("sha256").update(String(value)).digest("hex");

          const mechanismSummary = (policies) => {
            const totals = new Map();
            for (const policy of policies) {
              const mechanisms = policy?.mechanisms || {};
              for (const [type, value] of Object.entries(mechanisms)) {
                const count = Array.isArray(value)
                  ? value.length
                  : value && typeof value === "object"
                    ? Object.keys(value).length
                    : value
                      ? 1
                      : 0;
                totals.set(type, (totals.get(type) || 0) + count);
              }
            }
            return [...totals.entries()]
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([type, count]) => ({ type, count }));
          };

          const evidence = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            source:
              "GitHub Actions release-blocker-evidence D016 alerts proof; stores only booleans, counts, hashes, HTTP status classes, and secret names.",
            secretsRedacted: true,
            containsSecretValues: false,
            checks: {
              requiredSecretsPresent: missing.length === 0,
              cloudflareTokenVerified: false,
              cloudflareAlertPoliciesReadable: false,
              cloudflareAlertPolicyExists: false,
              cloudflareEnabledAlertPolicyExists: false,
              cloudflareRoutingDestinationConfigured: false,
              syntheticRoutingTriggered: false,
              syntheticRoutingDelivered: false,
            },
            cloudflare: {
              accountIdHash: accountId ? hash(accountId) : null,
              policyCount: null,
              enabledPolicyCount: null,
              routingMechanismSummary: [],
            },
            synthetic: {
              destinationType: "slack-webhook",
              destinationHash: slackWebhookUrl ? hash(slackWebhookUrl) : null,
              httpStatusClass: null,
            },
            missingSecretNames: missing,
            blocker: null,
          };

          const write = () => {
            const serialized = JSON.stringify(evidence, null, 2);
            if (
              /https?:\/\/hooks\.slack\.com\/services\/|cf[_-]?[a-z0-9]{16,}|cloudflare[_-]?api[_-]?token\s*[:=]|BEGIN [A-Z ]+PRIVATE KEY|postgres(?:ql)?:\/\//i.test(
                serialized,
              )
            ) {
              throw new Error("D016 alerts proof contains a forbidden secret-shaped value.");
            }
            fs.writeFileSync(outPath, `${serialized}\n`, "utf8");
          };

          if (missing.length > 0) {
            evidence.blocker = `Missing required secret names: ${missing.join(", ")}`;
            write();
            console.log("D016_ALERTS_GATE=BLOCKED");
            process.exit(0);
          }

          (async () => {
            const cfHeaders = {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            };

            const cfFetch = async (path) => {
              const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                headers: cfHeaders,
              });
              const body = await response.json().catch(() => ({}));
              return { response, body };
            };

            try {
              const tokenProof = await cfFetch("/user/tokens/verify");
              evidence.checks.cloudflareTokenVerified =
                tokenProof.response.ok && tokenProof.body?.success === true;

              const policiesProof = await cfFetch(
                `/accounts/${encodeURIComponent(accountId)}/alerting/v3/policies`,
              );

              if (policiesProof.response.ok && policiesProof.body?.success === true) {
                const policies = Array.isArray(policiesProof.body.result)
                  ? policiesProof.body.result
                  : [];
                const enabledPolicies = policies.filter((policy) => policy?.enabled !== false);
                const routingSummary = mechanismSummary(policies);

                evidence.checks.cloudflareAlertPoliciesReadable = true;
                evidence.checks.cloudflareAlertPolicyExists = policies.length > 0;
                evidence.checks.cloudflareEnabledAlertPolicyExists =
                  enabledPolicies.length > 0;
                evidence.checks.cloudflareRoutingDestinationConfigured =
                  routingSummary.some((entry) => entry.count > 0);
                evidence.cloudflare.policyCount = policies.length;
                evidence.cloudflare.enabledPolicyCount = enabledPolicies.length;
                evidence.cloudflare.routingMechanismSummary = routingSummary;
              } else {
                evidence.blocker = `Cloudflare alert policies API unavailable or unauthorized: HTTP ${policiesProof.response.status}`;
              }

              const syntheticPayload = {
                text: `[Salary Hijacking D016] synthetic alert routing check ${process.env.GITHUB_RUN_ID}`,
              };
              const slackResponse = await fetch(slackWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(syntheticPayload),
              });
              evidence.checks.syntheticRoutingTriggered = true;
              evidence.checks.syntheticRoutingDelivered = slackResponse.ok;
              evidence.synthetic.httpStatusClass = `${Math.floor(slackResponse.status / 100)}xx`;

              const pass =
                evidence.checks.requiredSecretsPresent &&
                evidence.checks.cloudflareTokenVerified &&
                evidence.checks.cloudflareAlertPoliciesReadable &&
                evidence.checks.cloudflareAlertPolicyExists &&
                evidence.checks.cloudflareEnabledAlertPolicyExists &&
                evidence.checks.cloudflareRoutingDestinationConfigured &&
                evidence.checks.syntheticRoutingTriggered &&
                evidence.checks.syntheticRoutingDelivered;

              if (!pass && !evidence.blocker) {
                evidence.blocker =
                  "D016 alerts proof did not satisfy policy/read/routing/synthetic delivery checks.";
              }
            } catch (error) {
              evidence.blocker = error instanceof Error ? error.message : String(error);
            }

            write();
            console.log(evidence.blocker ? "D016_ALERTS_GATE=BLOCKED" : "D016_ALERTS_GATE=PASS");
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

          if node -e "const e=require('./release/d016-alerts-proof.local.json'); process.exit(e.blocker ? 1 : 0)"; then
            echo "gate=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "gate=BLOCKED" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload D016 alerts proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d016-alerts-proof-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: release/d016-alerts-proof.local.json

      - name: Enforce D016 alerts proof gate
        run: |
          set -euo pipefail
          if [ "${{ steps.collect.outputs.gate }}" != "PASS" ]; then
            echo "::error::D016 alerts proof is blocked. Download d016-alerts-proof artifact for the sanitized blocker."
            exit 1
          fi

  android-production-aab:
    name: Android production AAB proof
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event.inputs.run_production_aab != 'false'

    environment:
      name: mobile-production

    env:
      APP_ENV: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      GOOGLE_SERVICES_JSON: ./google-services.json
      GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON_CONTENT }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_PACKAGE: com.salaryhijacking.mobile
      EXPO_PUBLIC_API_BASE_URL: https://api.salaryhijacking.com
      EXPO_PUBLIC_DEEPLINK_HOST: salaryhijacking.com
      EXPO_PUBLIC_RELEASE_CHANNEL: production
      EXPO_PUBLIC_CRASH_REPORTING_ENABLED: "true"
      EXPO_PUBLIC_E2E_BUILD: "false"
      EXPO_PUBLIC_ADS_ENABLED: "true"
      EXPO_PUBLIC_PARTNER_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production build secrets without logging values
        id: prepare
        run: |
          set -euo pipefail

          mkdir -p release release-artifacts/mobile "$MOBILE_APP_DIR"

          node <<'NODE'
          const fs = require("node:fs");

          const missing = [];
          const required = [
            "EXPO_TOKEN",
            "EAS_PROJECT_ID",
            "ADMOB_ANDROID_APP_ID",
          ];

          for (const name of required) {
            if (!process.env[name]) missing.push(name);
          }

          if (
            process.env.EAS_PROJECT_ID &&
            !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
              process.env.EAS_PROJECT_ID,
            )
          ) {
            missing.push("EAS_PROJECT_ID_VALID_UUID");
          }

          if (
            process.env.ADMOB_ANDROID_APP_ID &&
            !/^ca-app-pub-\d{16}~\d{10}$/u.test(process.env.ADMOB_ANDROID_APP_ID)
          ) {
            missing.push("ADMOB_ANDROID_APP_ID_VALID_FORMAT");
          }

          const googleServicesPath = "apps/mobile/google-services.json";
          const googleServicesStatus = {
            source: "none",
            prepared: false,
            validJson: false,
            androidPackageMatched: false,
          };

          if (!fs.existsSync(googleServicesPath)) {
            const raw = process.env.GOOGLE_SERVICES_JSON_CONTENT || "";
            const base64 = process.env.GOOGLE_SERVICES_JSON_BASE64 || "";
            let content = raw;

            if (!content && base64) {
              try {
                content = Buffer.from(base64, "base64").toString("utf8");
                googleServicesStatus.source = "GOOGLE_SERVICES_JSON_BASE64";
              } catch {
                missing.push("GOOGLE_SERVICES_JSON_BASE64_VALID_JSON");
              }
            } else if (content) {
              googleServicesStatus.source = "GOOGLE_SERVICES_JSON_CONTENT";
            }

            if (content) {
              fs.writeFileSync(googleServicesPath, content, "utf8");
            }
          } else {
            googleServicesStatus.source = "checked-in-or-workspace-file";
          }

          if (!fs.existsSync(googleServicesPath)) {
            missing.push("GOOGLE_SERVICES_JSON_CONTENT_OR_BASE64");
          } else {
            try {
              const parsed = JSON.parse(fs.readFileSync(googleServicesPath, "utf8"));
              googleServicesStatus.prepared = true;
              googleServicesStatus.validJson = true;
              const androidPackageNames = (Array.isArray(parsed.client) ? parsed.client : [])
                .map((client) => client?.client_info?.android_client_info?.package_name)
                .filter((value) => typeof value === "string");
              googleServicesStatus.androidPackageMatched = androidPackageNames.includes(
                process.env.ANDROID_PACKAGE || "com.salaryhijacking.mobile",
              );
              if (!googleServicesStatus.androidPackageMatched) {
                missing.push("GOOGLE_SERVICES_JSON_PACKAGE_MATCH");
              }
            } catch {
              missing.push(`${googleServicesStatus.source || "GOOGLE_SERVICES_JSON"}_VALID_JSON`);
            }
          }

          const proof = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            source:
              "GitHub Actions Android production AAB proof preflight; stores only required secret names and booleans.",
            secretsRedacted: true,
            containsSecretValues: false,
            checks: {
              requiredProductionBuildSecretsPresent: missing.length === 0,
              expoTokenPresent: Boolean(process.env.EXPO_TOKEN),
              easProjectIdPresent: Boolean(process.env.EAS_PROJECT_ID),
              easProjectIdValidUuid:
                Boolean(process.env.EAS_PROJECT_ID) &&
                /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
                  process.env.EAS_PROJECT_ID,
                ),
              admobAndroidAppIdPresent: Boolean(process.env.ADMOB_ANDROID_APP_ID),
              admobIosAppIdRequired: false,
              googleServicesJsonPrepared: googleServicesStatus.prepared,
              googleServicesJsonValid: googleServicesStatus.validJson,
              googleServicesAndroidPackageMatched:
                googleServicesStatus.androidPackageMatched,
            },
            googleServices: googleServicesStatus,
            missingSecretNames: missing,
          };

          const serialized = JSON.stringify(proof, null, 2);
          if (/ca-app-pub-\d{16}~\d{10}|eas_[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]+PRIVATE KEY|private_key|client_email/i.test(serialized)) {
            throw new Error("Production AAB secret preflight proof contains a forbidden value.");
          }
          fs.writeFileSync("release/android-production-aab-preflight.local.json", `${serialized}\n`, "utf8");

          if (missing.length > 0) {
            console.error(`::error::Missing or invalid production build secret names: ${missing.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Verify EAS project identity
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          set -euo pipefail

          set +e
          pnpm dlx eas-cli@23.2.0 whoami --non-interactive > ../../release/eas-whoami.redacted.txt 2> ../../release/eas-whoami.stderr.txt
          whoami_status=$?
          pnpm dlx eas-cli@23.2.0 project:info --non-interactive > ../../release/eas-project-info.raw.txt 2> ../../release/eas-project-info.stderr.txt
          project_info_status=$?
          set -e
          printf '%s\n' "$whoami_status" > ../../release/eas-whoami.status.txt
          printf '%s\n' "$project_info_status" > ../../release/eas-project-info.status.txt

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const stripAnsi = (value) =>
            String(value).replace(/\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])/g, "");
          const normalizeKey = (value) =>
            String(value).toLowerCase().replace(/[^a-z0-9]/g, "");
          const readProjectInfo = (file) => {
            const raw = stripAnsi(fs.readFileSync(file, "utf8"));
            try {
              return JSON.parse(raw);
            } catch {
              const entries = {};
              for (const line of raw.split(/\r?\n/u)) {
                const match = line.match(/^\s*([A-Za-z][A-Za-z0-9_:/ -]*?)\s{2,}(.+?)\s*$/u);
                if (match) {
                  entries[match[1].trim()] = match[2].trim();
                  entries[normalizeKey(match[1])] = match[2].trim();
                }
              }
              return entries;
            }
          };
          const hash = (value) =>
            crypto.createHash("sha256").update(String(value)).digest("hex");

          const configuredProjectId = process.env.EAS_PROJECT_ID || "";
          const whoami = fs.existsSync("../../release/eas-whoami.redacted.txt")
            ? fs.readFileSync("../../release/eas-whoami.redacted.txt", "utf8").trim()
            : "";
          const whoamiExitCode = Number.parseInt(
            fs.readFileSync("../../release/eas-whoami.status.txt", "utf8").trim(),
            10,
          );
          const whoamiError = fs.existsSync("../../release/eas-whoami.stderr.txt")
            ? stripAnsi(fs.readFileSync("../../release/eas-whoami.stderr.txt", "utf8")).trim()
            : "";
          const projectInfoExitCode = Number.parseInt(
            fs.readFileSync("../../release/eas-project-info.status.txt", "utf8").trim(),
            10,
          );
          const projectInfoError = fs.existsSync("../../release/eas-project-info.stderr.txt")
            ? stripAnsi(fs.readFileSync("../../release/eas-project-info.stderr.txt", "utf8")).trim()
            : "";
          const projectInfo = readProjectInfo("../../release/eas-project-info.raw.txt");
          const remoteProjectId =
            projectInfo?.id ||
            projectInfo?.projectId ||
            projectInfo?.projectID ||
            projectInfo?.projectid ||
            projectInfo?.["Project ID"] ||
            projectInfo?.project?.id ||
            projectInfo?.project?.projectId ||
            "";
          const proof = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            source: "EAS project identity preflight for Android production AAB; hashes only.",
            secretsRedacted: true,
            containsSecretValues: false,
            checks: {
              easWhoamiCommandSucceeded: whoamiExitCode === 0,
              easAuthenticated: Boolean(whoami) && whoamiExitCode === 0,
              easProjectInfoCommandSucceeded: projectInfoExitCode === 0,
              easProjectMetadataPresent: Boolean(remoteProjectId),
              easProjectIdRemoteMatch:
                Boolean(remoteProjectId) && remoteProjectId === configuredProjectId,
              easProjectIdRemoteMismatch:
                Boolean(remoteProjectId) && remoteProjectId !== configuredProjectId,
            },
            proof: {
              accountNameHash: hash(whoami),
              whoamiExitCode: Number.isFinite(whoamiExitCode) ? whoamiExitCode : null,
              whoamiErrorHash: whoamiError ? hash(whoamiError) : null,
              projectIdConfiguredHash: hash(configuredProjectId),
              projectIdRemoteHash: hash(remoteProjectId),
              projectInfoExitCode: Number.isFinite(projectInfoExitCode)
                ? projectInfoExitCode
                : null,
              projectInfoErrorHash: projectInfoError ? hash(projectInfoError) : null,
            },
          };
          const serialized = JSON.stringify(proof, null, 2);
          if (/eas_[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]+PRIVATE KEY|postgres(?:ql)?:\/\//i.test(serialized)) {
            throw new Error("EAS identity proof contains a forbidden secret-shaped value.");
          }
          fs.writeFileSync("../../release/eas-production-project-proof.local.json", `${serialized}\n`, "utf8");
          fs.rmSync("../../release/eas-whoami.stderr.txt", { force: true });
          fs.rmSync("../../release/eas-whoami.status.txt", { force: true });
          fs.rmSync("../../release/eas-project-info.raw.txt", { force: true });
          fs.rmSync("../../release/eas-project-info.stderr.txt", { force: true });
          fs.rmSync("../../release/eas-project-info.status.txt", { force: true });
          if (!proof.checks.easAuthenticated || proof.checks.easProjectIdRemoteMismatch) {
            throw new Error("EAS project identity did not match configured EAS_PROJECT_ID.");
          }
          NODE

      - name: Sync EAS production config-time variables
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          set -euo pipefail

          sync_env_var() {
            local name="$1"
            local visibility="$2"
            local value="${!name:-}"
            set +e
            pnpm dlx eas-cli@23.2.0 env:set production \
              --scope project \
              --name "$name" \
              --type string \
              --value "$value" \
              --visibility "$visibility" \
              --non-interactive \
              --json > "../../release/eas-config-env-${name}.raw.json" 2> "../../release/eas-config-env-${name}.stderr.txt"
            local status=$?
            set -e
            printf '%s\n' "$status" > "../../release/eas-config-env-${name}.status.txt"
          }

          sync_env_var EAS_PROJECT_ID plaintext
          sync_env_var ADMOB_ANDROID_APP_ID sensitive
          sync_env_var GOOGLE_SERVICES_JSON plaintext

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const names = [
            "EAS_PROJECT_ID",
            "ADMOB_ANDROID_APP_ID",
            "GOOGLE_SERVICES_JSON",
          ];
          const stripAnsi = (value) =>
            String(value).replace(/\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])/g, "");
          const hash = (value) =>
            crypto.createHash("sha256").update(String(value)).digest("hex");
          const records = names.map((name) => {
            const statusPath = `../../release/eas-config-env-${name}.status.txt`;
            const rawPath = `../../release/eas-config-env-${name}.raw.json`;
            const stderrPath = `../../release/eas-config-env-${name}.stderr.txt`;
            const status = fs.existsSync(statusPath)
              ? Number.parseInt(fs.readFileSync(statusPath, "utf8").trim(), 10)
              : null;
            const raw = fs.existsSync(rawPath)
              ? stripAnsi(fs.readFileSync(rawPath, "utf8"))
              : "";
            const stderr = fs.existsSync(stderrPath)
              ? stripAnsi(fs.readFileSync(stderrPath, "utf8"))
              : "";
            const combined = `${raw}\n${stderr}`;
            fs.rmSync(statusPath, { force: true });
            fs.rmSync(rawPath, { force: true });
            fs.rmSync(stderrPath, { force: true });

            return {
              name,
              exitCode: Number.isFinite(status) ? status : null,
              synced: status === 0,
              rawOutputHash: raw ? hash(raw) : null,
              stderrHash: stderr ? hash(stderr) : null,
              failureSignals: {
                authenticationFailure: /not logged in|unauthorized|authentication|invalid token/i.test(
                  combined,
                ),
                permissionFailure: /forbidden|permission|not authorized/i.test(combined),
                invalidVisibility:
                  /visibility|sensitive|secret|plaintext/i.test(combined) &&
                  status !== 0,
                invalidValue: /invalid|validation|format/i.test(combined) && status !== 0,
              },
            };
          });

          const proof = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            source:
              "EAS production config-time environment sync proof; stores only variable names, statuses, and hashes.",
            secretsRedacted: true,
            containsSecretValues: false,
            checks: {
              easProjectIdSynced:
                records.find((item) => item.name === "EAS_PROJECT_ID")?.synced === true,
              admobAndroidAppIdSynced:
                records.find((item) => item.name === "ADMOB_ANDROID_APP_ID")?.synced === true,
              googleServicesJsonPathSynced:
                records.find((item) => item.name === "GOOGLE_SERVICES_JSON")?.synced === true,
              admobIosAppIdRequired: false,
            },
            records,
            blocker: null,
          };
          const pass =
            proof.checks.easProjectIdSynced &&
            proof.checks.admobAndroidAppIdSynced &&
            proof.checks.googleServicesJsonPathSynced &&
            proof.checks.admobIosAppIdRequired === false;
          if (!pass) {
            proof.blocker =
              "EAS production config-time environment variables were not verified.";
          }

          const serialized = JSON.stringify(proof, null, 2);
          if (/ca-app-pub-\d{16}~\d{10}|eas_[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]+PRIVATE KEY|private_key|client_email|postgres(?:ql)?:\/\//i.test(serialized)) {
            throw new Error("EAS config-time env proof contains a forbidden secret-shaped value.");
          }
          fs.writeFileSync("../../release/eas-production-config-env-proof.local.json", `${serialized}\n`, "utf8");
          if (!pass) {
            throw new Error(proof.blocker);
          }
          NODE

      - name: Verify EAS archive Google Services file path
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const hash = (value) =>
            crypto.createHash("sha256").update(String(value)).digest("hex");
          const googleServicesPath = "./google-services.json";
          const easIgnorePath = "./.easignore";
          const gitIgnorePath = "./.gitignore";
          const localFilePresent = fs.existsSync(googleServicesPath);
          const easIgnorePresent = fs.existsSync(easIgnorePath);
          const gitIgnorePresent = fs.existsSync(gitIgnorePath);
          let localFileValidJson = false;
          let androidPackageMatched = false;
          let easArchiveAllowsRootGoogleServicesFile = false;
          let gitKeepsRootGoogleServicesIgnored = false;

          if (localFilePresent) {
            try {
              const parsed = JSON.parse(fs.readFileSync(googleServicesPath, "utf8"));
              localFileValidJson = true;
              const androidPackageNames = (Array.isArray(parsed.client) ? parsed.client : [])
                .map((client) => client?.client_info?.android_client_info?.package_name)
                .filter((value) => typeof value === "string");
              androidPackageMatched = androidPackageNames.includes(
                process.env.ANDROID_PACKAGE || "com.salaryhijacking.mobile",
              );
            } catch {
              localFileValidJson = false;
            }
          }

          if (easIgnorePresent) {
            const easIgnore = fs.readFileSync(easIgnorePath, "utf8");
            const easIgnoreLines = easIgnore
              .split(/\r?\n/u)
              .map((line) => line.trim())
              .filter((line) => line && !line.startsWith("#"));
            easArchiveAllowsRootGoogleServicesFile =
              easIgnoreLines.includes("!google-services.json") &&
              !easIgnoreLines.some(
                (line) =>
                  line !== "!google-services.json" &&
                  /^(?:\*\*\/)?google-services\.json$/u.test(line),
              );
          }

          if (gitIgnorePresent) {
            const gitIgnore = fs.readFileSync(gitIgnorePath, "utf8");
            gitKeepsRootGoogleServicesIgnored =
              /^google-services\.json$/mu.test(gitIgnore) ||
              /^\*\*\/google-services\.json$/mu.test(gitIgnore);
          }

          const proof = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            source:
              "EAS production Google Services archive path proof; stores only booleans, hashes, and metadata labels.",
            secretsRedacted: true,
            containsSecretValues: false,
            checks: {
              localGoogleServicesFilePresent: localFilePresent,
              localGoogleServicesFileValidJson: localFileValidJson,
              googleServicesAndroidPackageMatched: androidPackageMatched,
              googleServicesJsonEnvMatchesArchivePath:
                process.env.GOOGLE_SERVICES_JSON === googleServicesPath,
              easIgnorePresent,
              easArchiveAllowsRootGoogleServicesFile,
              gitIgnorePresent,
              gitKeepsRootGoogleServicesIgnored,
            },
            proof: {
              localFileHash: localFilePresent
                ? hash(fs.readFileSync(googleServicesPath, "utf8"))
                : null,
              googleServicesPath,
            },
            blocker: null,
          };

          const pass =
            proof.checks.localGoogleServicesFilePresent &&
            proof.checks.localGoogleServicesFileValidJson &&
            proof.checks.googleServicesAndroidPackageMatched &&
            proof.checks.googleServicesJsonEnvMatchesArchivePath &&
            proof.checks.easIgnorePresent &&
            proof.checks.easArchiveAllowsRootGoogleServicesFile &&
            proof.checks.gitKeepsRootGoogleServicesIgnored;

          if (!pass) {
            proof.blocker =
              "EAS production google-services.json archive path was not verified.";
          }

          const serialized = JSON.stringify(proof, null, 2);
          if (/ca-app-pub-\d{16}~\d{10}|eas_[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]+PRIVATE KEY|private_key|client_email|postgres(?:ql)?:\/\//i.test(serialized)) {
            throw new Error("EAS Google Services archive proof contains a forbidden secret-shaped value.");
          }
          fs.writeFileSync("../../release/eas-google-services-archive-proof.local.json", `${serialized}\n`, "utf8");

          if (!pass) {
            throw new Error(proof.blocker);
          }
          NODE

      - name: Build Android production AAB with EAS
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          set -euo pipefail

          set +e
          pnpm dlx eas-cli@23.2.0 build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > ../../release/eas-production-build.raw.json 2> ../../release/eas-production-build.stderr.txt
          build_status=$?
          set -e
          printf '%s\n' "$build_status" > ../../release/eas-production-build.status.txt

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const stripAnsi = (value) =>
            String(value).replace(/\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])/g, "");
          const hash = (value) =>
            crypto.createHash("sha256").update(String(value)).digest("hex");
          const sanitizeLine = (value) =>
            stripAnsi(value)
              .replace(/https?:\/\/\S+/gi, "[url-redacted]")
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/gi, "[uuid-redacted]")
              .replace(/ca-app-pub-\d{16}~\d{10}/g, "[admob-app-id-redacted]")
              .replace(/eas_[A-Za-z0-9_-]{20,}/g, "[eas-token-redacted]")
              .replace(/AIza[0-9A-Za-z_-]{20,}/g, "[firebase-api-key-redacted]")
              .replace(/([A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|PRIVATE_KEY|CLIENT_EMAIL|DATABASE_URL)[A-Z0-9_]*=)\S+/gi, "$1[redacted]")
              .replace(/BEGIN [A-Z ]+PRIVATE KEY[\s\S]*?END [A-Z ]+PRIVATE KEY/g, "[private-key-redacted]")
              .replace(/\s+/g, " ")
              .trim();
          const collectLogUrls = (value, path = "") => {
            if (!value || typeof value !== "object") return [];
            const output = [];
            for (const [key, entry] of Object.entries(value)) {
              const nextPath = path ? `${path}.${key}` : key;
              if (
                typeof entry === "string" &&
                /^https?:\/\//u.test(entry) &&
                /log/i.test(nextPath)
              ) {
                output.push({ key: nextPath, url: entry });
              } else if (entry && typeof entry === "object") {
                output.push(...collectLogUrls(entry, nextPath));
              }
            }
            return output.slice(0, 12);
          };
          const extractSignalLines = (body) => {
            const lines = stripAnsi(body).split(/\r?\n/u);
            const matches = [];
            for (const line of lines) {
              if (
                /error|fail|exception|google-services|googleServicesFile|install dependencies|pnpm|node|gradle|credential|keystore|signing|unknown error/i.test(
                  line,
                )
              ) {
                const sanitized = sanitizeLine(line).slice(0, 500);
                if (sanitized) matches.push(sanitized);
              }
              if (matches.length >= 80) break;
            }
            return matches;
          };
          const raw = fs.existsSync("../../release/eas-production-build.raw.json")
            ? stripAnsi(fs.readFileSync("../../release/eas-production-build.raw.json", "utf8"))
            : "";
          let parsed = null;
          try {
            parsed = raw.trim() ? JSON.parse(raw) : null;
          } catch {
            parsed = null;
          }
          const builds = Array.isArray(parsed) ? parsed : parsed ? [parsed] : [];
          const build = builds.find((item) => String(item?.platform || "").toUpperCase() === "ANDROID") || builds[0] || null;
          const logTargets = collectLogUrls(build);

          (async () => {
            const fetched = [];
            for (const target of logTargets.slice(0, 6)) {
              try {
                const response = await fetch(target.url);
                const text = response.ok ? await response.text() : "";
                fetched.push({
                  key: target.key,
                  status: response.status,
                  ok: response.ok,
                  bodyHash: text ? hash(text) : null,
                  signalLines: response.ok ? extractSignalLines(text) : [],
                });
              } catch (error) {
                fetched.push({
                  key: target.key,
                  status: null,
                  ok: false,
                  errorClass:
                    error && typeof error === "object" && "name" in error
                      ? String(error.name)
                      : "Error",
                  signalLines: [],
                });
              }
            }

            const combinedLines = fetched.flatMap((entry) => entry.signalLines);
            const proof = {
              schemaVersion: 1,
              observedAt: new Date().toISOString(),
              source:
                "EAS Android production remote build log classification proof; raw log URLs and secrets are not stored.",
              secretsRedacted: true,
              containsSecretValues: false,
              checks: {
                androidBuildMetadataObserved: Boolean(build),
                remoteLogUrlCount: logTargets.length,
                remoteLogFetchAttempted: logTargets.length > 0,
                remoteLogFetchedCount: fetched.filter((entry) => entry.ok).length,
              },
              failureSignals: {
                googleServicesFileNotUploaded: /googleServicesFile|google-services\.json.+(?:missing|not checked in|uploaded)/i.test(
                  combinedLines.join("\n"),
                ),
                installDependenciesPhase: /install dependencies/i.test(
                  combinedLines.join("\n"),
                ),
                pnpmFailure: /\bpnpm\b/i.test(combinedLines.join("\n")),
                gradleFailure: /gradle|Task :app/i.test(combinedLines.join("\n")),
                credentialsFailure: /credential|keystore|signing/i.test(
                  combinedLines.join("\n"),
                ),
              },
              logs: fetched.map((entry) => ({
                key: entry.key,
                status: entry.status,
                ok: entry.ok,
                bodyHash: entry.bodyHash || null,
                errorClass: entry.errorClass || null,
                signalLines: entry.signalLines.slice(0, 20),
              })),
            };

            const serialized = JSON.stringify(proof, null, 2);
            if (/expo\.dev\/artifacts|\.aab\?|eas_[A-Za-z0-9_-]{20,}|ca-app-pub-\d{16}~\d{10}|AIza[0-9A-Za-z_-]{20,}|BEGIN [A-Z ]+PRIVATE KEY|private_key|client_email|postgres(?:ql)?:\/\//i.test(serialized)) {
              throw new Error("EAS remote log classification proof contains a forbidden secret or artifact URL marker.");
            }
            fs.writeFileSync("../../release/eas-production-remote-log-summary.local.json", `${serialized}\n`, "utf8");
          })().catch((error) => {
            const fallback = {
              schemaVersion: 1,
              observedAt: new Date().toISOString(),
              source:
                "EAS Android production remote build log classification fallback proof.",
              secretsRedacted: true,
              containsSecretValues: false,
              checks: {
                androidBuildMetadataObserved: Boolean(build),
                remoteLogUrlCount: logTargets.length,
                remoteLogFetchAttempted: false,
                remoteLogFetchedCount: 0,
              },
              errorClass:
                error && typeof error === "object" && "name" in error
                  ? String(error.name)
                  : "Error",
            };
            fs.writeFileSync("../../release/eas-production-remote-log-summary.local.json", `${JSON.stringify(fallback, null, 2)}\n`, "utf8");
          });
          NODE

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const stripAnsi = (value) =>
            String(value).replace(/\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])/g, "");
          const hash = (value) =>
            crypto.createHash("sha256").update(String(value)).digest("hex");
          const status = Number.parseInt(
            fs.readFileSync("../../release/eas-production-build.status.txt", "utf8").trim(),
            10,
          );
          const raw = fs.existsSync("../../release/eas-production-build.raw.json")
            ? stripAnsi(fs.readFileSync("../../release/eas-production-build.raw.json", "utf8"))
            : "";
          const stderr = fs.existsSync("../../release/eas-production-build.stderr.txt")
            ? stripAnsi(fs.readFileSync("../../release/eas-production-build.stderr.txt", "utf8"))
            : "";
          const combined = `${raw}\n${stderr}`;
          let parsed = null;
          try {
            parsed = raw.trim() ? JSON.parse(raw) : null;
          } catch {
            parsed = null;
          }
          const builds = Array.isArray(parsed) ? parsed : parsed ? [parsed] : [];
          const androidBuild =
            builds.find((item) => String(item?.platform || "").toUpperCase() === "ANDROID") ||
            builds[0] ||
            null;
          const buildUrl =
            androidBuild?.buildDetailsPageUrl ||
            androidBuild?.buildUrl ||
            androidBuild?.url ||
            "";
          const artifactUrl =
            androidBuild?.artifacts?.buildUrl ||
            androidBuild?.artifactUrl ||
            androidBuild?.applicationArchiveUrl ||
            androidBuild?.artifacts?.applicationArchiveUrl ||
            "";
          const statusText = androidBuild?.status ? String(androidBuild.status).toUpperCase() : null;
          const sanitizeText = (value) =>
            String(value)
              .replace(/https?:\/\/\S+/gi, "[url-redacted]")
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/gi, "[uuid-redacted]")
              .replace(/ca-app-pub-\d{16}~\d{10}/g, "[admob-app-id-redacted]")
              .replace(/eas_[A-Za-z0-9_-]{20,}/g, "[eas-token-redacted]")
              .replace(/BEGIN [A-Z ]+PRIVATE KEY[\s\S]*?END [A-Z ]+PRIVATE KEY/g, "[private-key-redacted]")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, 300);
          const collectRemoteErrors = (value, path = "") => {
            if (!value || typeof value !== "object") return [];
            const output = [];
            for (const [key, entry] of Object.entries(value)) {
              const nextPath = path ? `${path}.${key}` : key;
              if (
                /error|fail|reason|message|phase|status|code/i.test(key) &&
                ["string", "number", "boolean"].includes(typeof entry)
              ) {
                const sanitized = sanitizeText(entry);
                if (sanitized) output.push({ key: nextPath, value: sanitized });
              } else if (entry && typeof entry === "object") {
                output.push(...collectRemoteErrors(entry, nextPath));
              }
            }
            return output.slice(0, 12);
          };
          const failureSignals = {
            googleServicesFileNotUploaded: /googleServicesFile[\s\S]*not checked in|won't be uploaded|google-services\.json.+missing/i.test(
              combined,
            ),
            easBuildFailed: /Build failed|status[^a-z0-9]+ERRORED|status[^a-z0-9]+FAILED/i.test(
              combined,
            ),
            credentialsMentioned: /credential|keystore|signing/i.test(combined),
            gradleMentioned: /gradle|Execution failed|Task :app/i.test(combined),
            projectOwnerMentioned: /project|owner|account/i.test(combined),
          };
          const proof = {
            schemaVersion: 1,
            observedAt: new Date().toISOString(),
            source:
              "EAS Android production AAB build command status proof; raw build URLs and secrets are not stored.",
            secretsRedacted: true,
            containsSecretValues: false,
            sourceSha: process.env.GITHUB_SHA || null,
            checks: {
              easBuildCommandSucceeded: status === 0,
              androidBuildMetadataObserved: Boolean(androidBuild),
              androidPlatform:
                !androidBuild || String(androidBuild?.platform || "").toUpperCase() === "ANDROID",
              easBuildFinished: statusText === "FINISHED",
              buildDetailsUrlStored: false,
              artifactUrlStored: false,
            },
            proof: {
              exitCode: Number.isFinite(status) ? status : null,
              parsedBuildCount: builds.length,
              buildIdHash: androidBuild?.id ? hash(androidBuild.id) : null,
              gitCommitHash: androidBuild?.gitCommitHash || null,
              status: statusText,
              distribution: androidBuild?.distribution || null,
              appVersion: androidBuild?.appVersion || null,
              appBuildVersion: androidBuild?.appBuildVersion || null,
              buildDetailsUrlHash: buildUrl ? hash(buildUrl) : null,
              artifactUrlHash: artifactUrl ? hash(artifactUrl) : null,
              rawOutputHash: raw ? hash(raw) : null,
              stderrHash: stderr ? hash(stderr) : null,
              buildObjectKeys: androidBuild && typeof androidBuild === "object"
                ? Object.keys(androidBuild).sort().slice(0, 40)
                : [],
              remoteErrorSamples: androidBuild
                ? collectRemoteErrors(androidBuild)
                : [],
              failureSignals,
            },
            blocker: null,
          };

          if (status !== 0 || statusText !== "FINISHED") {
            proof.blocker =
              "EAS Android production AAB remote build did not finish successfully.";
          }

          const serialized = JSON.stringify(proof, null, 2);
          if (/expo\.dev\/artifacts|\.aab\?|eas_[A-Za-z0-9_-]{20,}|ca-app-pub-\d{16}~\d{10}|BEGIN [A-Z ]+PRIVATE KEY|private_key|client_email|postgres(?:ql)?:\/\//i.test(serialized)) {
            throw new Error("EAS build status proof contains a forbidden secret or artifact URL marker.");
          }
          fs.writeFileSync("../../release/eas-production-build-status.local.json", `${serialized}\n`, "utf8");
          fs.rmSync("../../release/eas-production-build.stderr.txt", { force: true });
          fs.rmSync("../../release/eas-production-build.status.txt", { force: true });
          if (status !== 0) {
            fs.rmSync("../../release/eas-production-build.raw.json", { force: true });
            throw new Error(proof.blocker);
          }
          NODE

      - name: Download and hash Android production AAB
        run: |
          set -euo pipefail

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const raw = fs.readFileSync("release/eas-production-build.raw.json", "utf8");
          const parsed = JSON.parse(raw);
          const builds = Array.isArray(parsed) ? parsed : [parsed];
          const build = builds.find((item) => String(item?.platform || "").toUpperCase() === "ANDROID") || builds[0];
          const buildUrl =
            build?.artifacts?.buildUrl ||
            build?.artifactUrl ||
            build?.applicationArchiveUrl ||
            build?.artifacts?.applicationArchiveUrl ||
            "";

          if (!build || !buildUrl) {
            throw new Error("EAS build output did not include an Android build artifact URL.");
          }

          const outputDir = "release-artifacts/mobile";
          fs.mkdirSync(outputDir, { recursive: true });
          const outputPath = path.join(outputDir, "salary-hijacking-production-final.aab");
          (async () => {
            const response = await fetch(buildUrl);
            if (!response.ok) {
              throw new Error(`Failed to download AAB artifact: HTTP ${response.status}`);
            }

            const buffer = Buffer.from(await response.arrayBuffer());
            if (buffer.length < 1024 * 1024) {
              throw new Error("Downloaded AAB artifact is unexpectedly small.");
            }
            fs.writeFileSync(outputPath, buffer);

            const sha256 = crypto.createHash("sha256").update(buffer).digest("hex").toUpperCase();
            const sourceSha = process.env.GITHUB_SHA || "";
            const evidence = {
              schemaVersion: 1,
              observedAt: new Date().toISOString(),
              source: "EAS Android production AAB build and download proof; artifact URL and secrets are not stored.",
              secretsRedacted: true,
              containsSecretValues: false,
              sourceSha,
              gitCommitHash: build.gitCommitHash || null,
              platform: build.platform || "ANDROID",
              profile: "production",
              distribution: build.distribution || "store",
              status: build.status || null,
              buildId: build.id || null,
              appVersion: build.appVersion || null,
              appBuildVersion: build.appBuildVersion || null,
              artifact: {
                fileName: path.basename(outputPath),
                byteSize: buffer.length,
                sha256,
                extension: ".aab",
              },
              checks: {
                sourceShaPresent: Boolean(sourceSha),
                easBuildFinished: String(build.status || "").toUpperCase() === "FINISHED",
                androidPlatform: String(build.platform || "").toUpperCase() === "ANDROID",
                productionProfile: true,
                artifactDownloaded: true,
                artifactSha256Present: /^[A-F0-9]{64}$/u.test(sha256),
                artifactUrlStored: false,
              },
            };

            const serialized = JSON.stringify(evidence, null, 2);
            if (/expo\.dev\/artifacts|\.aab\?|eas_[A-Za-z0-9_-]{20,}|ca-app-pub-\d{16}~\d{10}|BEGIN [A-Z ]+PRIVATE KEY|private_key|postgres(?:ql)?:\/\//i.test(serialized)) {
              throw new Error("Production AAB proof contains a forbidden secret or artifact URL marker.");
            }
            fs.writeFileSync("release/android-production-aab-proof.local.json", `${serialized}\n`, "utf8");
            fs.rmSync("release/eas-production-build.raw.json", { force: true });

            const requiredChecks = [
              evidence.checks.sourceShaPresent,
              evidence.checks.easBuildFinished,
              evidence.checks.androidPlatform,
              evidence.checks.productionProfile,
              evidence.checks.artifactDownloaded,
              evidence.checks.artifactSha256Present,
              evidence.checks.artifactUrlStored === false,
            ];
            if (!requiredChecks.every(Boolean)) {
              throw new Error("Production AAB evidence checks did not all pass.");
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Upload Android production AAB proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab-proof-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/android-production-aab-preflight.local.json
            release/eas-production-project-proof.local.json
            release/eas-production-config-env-proof.local.json
            release/eas-google-services-archive-proof.local.json
            release/eas-production-remote-log-summary.local.json
            release/eas-production-build-status.local.json
            release/android-production-aab-proof.local.json

      - name: Upload Android production AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/mobile/salary-hijacking-production-final.aab
