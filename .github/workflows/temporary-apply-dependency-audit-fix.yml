name: Temporary apply dependency audit fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-apply-dependency-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: temporary-apply-dependency-audit-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Apply dependency audit fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const workspacePath = 'pnpm-workspace.yaml';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const policy = packageJson.pnpm ?? {
            onlyBuiltDependencies: ['@cloudflare/workerd', 'esbuild', 'sharp', 'workerd'],
            overrides: {},
            peerDependencyRules: { ignoreMissing: [] },
            auditConfig: { ignoreCves: ['CVE-2025-71330', 'CVE-2025-71329'] },
          };

          policy.overrides ??= {};
          delete policy.overrides['brace-expansion@>=4.0.0 <5.0.8'];
          policy.overrides['brace-expansion@>=4.0.0 <5.0.9'] = '5.0.9';
          delete packageJson.pnpm;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const quote = (value) => JSON.stringify(value);
          let workspace = fs.readFileSync(workspacePath, 'utf8').replace(/\r\n/g, '\n');
          if (!workspace.includes('\nonlyBuiltDependencies:')) {
            const lines = [''];
            lines.push('onlyBuiltDependencies:');
            for (const dependency of policy.onlyBuiltDependencies ?? []) {
              lines.push(`  - ${quote(dependency)}`);
            }
            lines.push('');
            lines.push('overrides:');
            for (const [selector, version] of Object.entries(policy.overrides)) {
              lines.push(`  ${quote(selector)}: ${quote(version)}`);
            }
            lines.push('');
            lines.push('peerDependencyRules:');
            lines.push('  ignoreMissing: []');
            lines.push('');
            lines.push('auditConfig:');
            lines.push('  ignoreCves:');
            for (const cve of policy.auditConfig?.ignoreCves ?? []) {
              lines.push(`    - ${quote(cve)}`);
            }
            workspace = `${workspace.trimEnd()}\n${lines.join('\n')}\n`;
          }
          fs.writeFileSync(workspacePath, workspace);
          NODE

      - name: Refresh lockfile
        run: corepack pnpm install --lockfile-only

      - name: Verify dependency audit
        run: corepack pnpm audit --audit-level high --prod=false --ignore-registry-errors

      - name: Verify package manager scripts
        run: node scripts/quality/check-package-manager-scripts.mjs

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit dependency audit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency audit changes to commit."
            exit 0
          fi
          git commit -m "Pin brace-expansion patched release for audit"
          git push
