name: neon-staging-api-database

on:
  workflow_dispatch:
    inputs:
      application_source_sha:
        description: "Production application source SHA represented by runtime persistence evidence."
        required: false
        default: ""
      staging_api_base_url:
        description: "Approved staging API base URL for authenticated persistence proof."
        required: false
        default: "https://salary-hijacking-api-staging.jinbizman.workers.dev"
  push:
    branches:
      - codex/payroll-reminder-launch-ready-100-20260714
    paths:
      - ".github/workflows/neon-staging-api-database.yml"
      - "scripts/release/collect-staging-authenticated-persistence-proof.mjs"
      - "scripts/release/collect-staging-authenticated-persistence-proof.test.mjs"
      - "scripts/release/neon-staging-connection-preflight.mjs"
      - "scripts/release/neon-staging-api-database-workflow-contract.test.mjs"
      - "services/api/**"
      - "database/migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: neon-staging-api-database
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  FORCE_COLOR: "1"
  TZ: Asia/Seoul
  STAGING_BRANCH: codex/payroll-reminder-launch-ready-100-20260714
  API_SERVICE_DIR: services/api
  STAGING_API_BASE_URL: ${{ inputs.staging_api_base_url || 'https://salary-hijacking-api-staging.jinbizman.workers.dev' }}
  PRODUCTION_ADMIN_READY_URL: https://admin.salaryhijacking.com/admin/api/v1/ready
  APPLICATION_SOURCE_SHA: ${{ inputs.application_source_sha || github.sha }}

jobs:
  preflight-sync-deploy-api-staging:
    name: Preflight and deploy API staging database binding
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: staging

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate staging-only workflow context
        run: |
          set -euo pipefail

          mkdir -p artifacts/neon-staging/status artifacts/neon-staging/diagnostics

          if [ "${GITHUB_REF_NAME:-}" != "$STAGING_BRANCH" ]; then
            echo "::error::This workflow may only run on $STAGING_BRANCH."
            exit 1
          fi

          case "${STAGING_API_BASE_URL:-}" in
            "https://api-staging.salaryhijacking.com"|"https://salary-hijacking-api-staging.jinbizman.workers.dev")
              ;;
            *)
              echo "::error::STAGING_API_BASE_URL must be an approved staging API endpoint."
              exit 1
              ;;
          esac

          if [ -z "${STAGING_DATABASE_URL:-}" ]; then
            echo "::error::Missing staging environment secret: STAGING_DATABASE_URL"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing staging environment secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing staging environment secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          echo "Staging environment secrets are present; values were not printed."
          touch artifacts/neon-staging/status/staging-environment-secrets-present

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run neon staging workflow contract
        run: node scripts/release/neon-staging-api-database-workflow-contract.test.mjs

      - name: Read-only Neon staging connection preflight
        run: |
          set -euo pipefail

          node scripts/release/neon-staging-connection-preflight.mjs \
            --out artifacts/neon-staging/neon-staging-connection-preflight.json

          touch artifacts/neon-staging/status/neon-staging-preflight-ok

      - name: Build API Worker
        run: pnpm --dir "$API_SERVICE_DIR" build

      - name: Wrangler staging dry-run
        run: pnpm --dir "$API_SERVICE_DIR" exec wrangler deploy --env staging --config wrangler.toml --dry-run

      - name: Sync staging database secret to Cloudflare API staging
        run: |
          set -euo pipefail

          cd "$API_SERVICE_DIR"
          printf '%s' "$STAGING_DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --env staging --config wrangler.toml
          touch ../../artifacts/neon-staging/status/cloudflare-api-staging-database-url-secret-put-ok

      - name: Verify Cloudflare API staging secret name
        run: |
          set -euo pipefail

          cd "$API_SERVICE_DIR"
          pnpm exec wrangler secret list --env staging --config wrangler.toml > ../../artifacts/neon-staging/diagnostics/cloudflare-api-staging-secret-names.json
          cd ../..
          node <<'NODE'
          const fs = require("node:fs");
          const secrets = JSON.parse(
            fs.readFileSync(
              "artifacts/neon-staging/diagnostics/cloudflare-api-staging-secret-names.json",
              "utf8",
            ),
          );
          if (!Array.isArray(secrets) || !secrets.some((secret) => secret?.name === "DATABASE_URL")) {
            throw new Error("Cloudflare API staging DATABASE_URL secret name was not found");
          }
          console.log("Cloudflare API staging DATABASE_URL secret name verified; value was not read.");
          fs.writeFileSync("artifacts/neon-staging/status/cloudflare-api-staging-database-url-secret-name-ok", "");
          NODE

      - name: Deploy API staging Worker
        run: pnpm --dir "$API_SERVICE_DIR" exec wrangler deploy --env staging --config wrangler.toml

      - name: Diagnose API staging public health and readiness
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const redact = (value) => String(value)
            .slice(0, 1200)
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/giu, "[redacted-email]")
            .replace(/\b(?:Bearer|Basic)\s+[A-Za-z0-9._~+/=-]+\b/gu, "[redacted-auth]")
            .replace(/\b(?:cf_clearance|session|token|jwt|secret|password|cookie)[^\s<>,;]*/giu, "[redacted-sensitive]");

          async function diagnose(pathname) {
            const url = `${process.env.STAGING_API_BASE_URL}${pathname}`;
            const response = await fetch(url, {
              headers: {
                accept: "application/json",
                "user-agent": "salary-hijacking-neon-staging-ci/1.0",
              },
            });
            const body = redact(await response.text());
            const headers = {};
            for (const key of ["cf-ray", "server", "content-type", "date", "cache-control"]) {
              const value = response.headers.get(key);
              if (value) headers[key] = value;
            }
            return {
              capturedAt: new Date().toISOString(),
              url,
              method: "GET",
              status: response.status,
              responseHeaders: headers,
              bodySnippet: body,
              storedCookie: false,
              storedAuthorization: false,
              storedToken: false,
            };
          }

          const results = {
            health: await diagnose("/health"),
            ready: await diagnose("/ready"),
          };

          fs.writeFileSync(
            "artifacts/neon-staging/diagnostics/api-staging-public-health-ready-ci.json",
            `${JSON.stringify(results, null, 2)}\n`,
          );

          const knownCloudflareChallenge = (entry) =>
            entry.status === 403 &&
            String(entry.responseHeaders?.server ?? "").toLowerCase() === "cloudflare";

          for (const [name, entry] of Object.entries(results)) {
            if (entry.status === 200) {
              fs.writeFileSync(`artifacts/neon-staging/status/api-staging-${name}-public-github-ok`, "");
              continue;
            }
            if (knownCloudflareChallenge(entry)) {
              fs.writeFileSync(`artifacts/neon-staging/status/api-staging-${name}-public-github-cloudflare-challenge`, "");
              continue;
            }
            throw new Error(`Unexpected API staging ${name} status ${entry.status}`);
          }

          console.log("API staging public health/readiness diagnostics collected without secret exposure; Cloudflare challenges are classified separately from application health.");
          NODE

      - name: Verify authenticated staging API persistence
        run: |
          set -euo pipefail

          node scripts/release/collect-staging-authenticated-persistence-proof.mjs \
            --out artifacts/neon-staging/authenticated-persistence-proof.json

          touch artifacts/neon-staging/status/authenticated-staging-api-persistence-ok

      - name: Verify production admin read-only regression
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          const response = await fetch(process.env.PRODUCTION_ADMIN_READY_URL, {
            headers: {
              accept: "application/json",
              "user-agent": "salary-hijacking-neon-staging-ci/1.0",
            },
          });
          if (response.status !== 200 && response.status !== 403) {
            throw new Error(`Unexpected production admin readiness status ${response.status}`);
          }
          console.log(`Production admin read-only readiness diagnostic status=${response.status}`);
          NODE

      - name: Write no-secret summary
        if: always()
        run: |
          {
            echo "## Neon staging API database binding"
            echo ""
            echo "- Ref: $GITHUB_REF"
            echo "- Commit: $GITHUB_SHA"
            echo "- Environment: staging"
            echo "- Secret values printed: no"
            echo "- Production database modified: no"
            echo "- Production Worker/DNS/routes/secrets modified: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload no-secret Neon staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-staging-api-database-evidence-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/neon-staging/**
